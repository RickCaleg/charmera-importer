name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the camera
        2. Select it in the device list
        3. ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the left sidebar.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer
        - Linux portable tarball
        - .deb package
        - .rpm package
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / Windows 11 23H2 / ..."
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera make/model (if relevant)
      placeholder: "Kodak PixPro FZ55"
